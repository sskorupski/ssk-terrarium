# Phase 1 wiring: SHT45 air sensor (I2C) and DS18B20 substrate probe (1-Wire)
# (step 6, RG-brochage). Source of capteurs.svg: regenerate with
# outils/schemas.sh after any change.
metadata:
  title: Phase 1 — Capteurs

connectors:
  KS5016:
    type: (A) Carte Keyestudio KS5016
    subtype: "3,3 V et GND : colonnes V et G du bloc ANALOG"
    pinlabels: [GPIO 21 (SDA), GPIO 22 (SCL), GPIO 4, "Rangée 3,3 V", Rangée GND]
  SHT45:
    type: (B) Capteur d'air Adafruit SHT45
    subtype: connecteur STEMMA QT
    pinlabels: [GND, V+, SDA, SCL]
  ADAPTATRICE:
    type: (D) Carte adaptatrice de la DS18B20
    subtype: Plugable Terminal V2, cavalier sur PULL UP (10 kΩ)
    pinlabels: ["−", "+", D]

cables:
  QT:
    wirecount: 4
    colors: [BK, RD, BU, YE]
    category: bundle
    type: (B) Câble STEMMA QT + fils Dupont
  W2:
    wirecount: 3
    colors: [BK, RD, GN]
    category: bundle
    type: (L) Fils Dupont

connections:
  - - KS5016: [5, 4]
    - QT: [1, 2]
    - SHT45: [1, 2]
  - - KS5016: [1, 2]
    - QT: [3, 4]
    - SHT45: [3, 4]
  - - KS5016: [5, 4]
    - W2: [1, 2]
    - ADAPTATRICE: [1, 2]
  - - KS5016: [3]
    - W2: [3]
    - ADAPTATRICE: [3]
