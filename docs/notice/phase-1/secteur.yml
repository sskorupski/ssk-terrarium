# Phase 1 wiring: 230 V heating circuit. Relay 1 switches the phase only;
# neutral and earth go straight to the socket (step 9). No fuse and no
# limiter in phase 1 (#9, #10): the power strip plugs into the socket.
# Source of secteur.svg:
# regenerate with outils/schemas.sh after any change.
metadata:
  title: Phase 1 — Câblage 230 V du chauffage

connectors:
  CORDON:
    type: (N) Cordon secteur 3G 1 mm² avec fiche
    pinlabels: [Phase, Neutre, Terre]
  RELAIS1:
    type: (E) Relais 1 du module (chauffage)
    pinlabels: [COM, "NO", NC (libre)]
  SOCLE:
    type: (Q) Socle de prise femelle
    subtype: reçoit la multiprise (V)
    pinlabels: ["L", "N", Terre]

cables:
  W1:
    wirecount: 3
    colors: [BN, BU, GNYE]
    gauge: 1 mm2
    category: bundle
    type: Fils du cordon
  W2:
    wirecount: 1
    colors: [BN]
    gauge: 1 mm2
    category: bundle
    type: Fil

connections:
  - - CORDON: [1]
    - W1: [1]
    - RELAIS1: [1]
  - - CORDON: [2, 3]
    - W1: [2, 3]
    - SOCLE: [2, 3]
  - - RELAIS1: [2]
    - W2: [1]
    - SOCLE: [1]
