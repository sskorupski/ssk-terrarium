# Phase 1 wiring: 12 V supply, LM2596 set to 5.0 V, and the jack cord to the
# board (steps 2, 3 and 8). Source of alimentation.svg: regenerate with
# outils/schemas.sh after any change.
metadata:
  title: Phase 1 — Alimentation 12 V et 5 V

connectors:
  EMBASE:
    type: Embase jack femelle 5,5 × 2,1 à bornier
    subtype: fiche du bloc 12 V enfoncée
    pinlabels: [+ (12 V), −]
  LM2596:
    type: Abaisseur LM2596, réglé à 5,0 V à vide
    pinlabels: [IN+, IN−, OUT+, OUT−]
  KS5016:
    type: Carte Keyestudio KS5016
    subtype: jack d'alimentation, centre +
    pinlabels: [Centre (+12 V), Manchon (−)]

cables:
  W1:
    wirecount: 2
    colors: [RD, BK]
    category: bundle
    type: Fil souple
  W2:
    wirecount: 2
    colors: [RD, BK]
    category: bundle
    type: Cordon jack mâle 5,5 × 2,1 (étape 8)

connections:
  - - EMBASE: [1, 2]
    - W1: [1, 2]
    - LM2596: [1, 2]
  - - EMBASE: [1, 2]
    - W2: [1, 2]
    - KS5016: [1, 2]
