# Phase 2 wiring: the second heating cable, for the air, on relay 2 (step 9,
# ssk-terrarium-cadrage 2026-019). The phase is split between relay 1
# (substrate cable) and relay 2 (air cable); neutral and earth go straight to
# both sockets. Still no fuse and no limiter (#9, #10). Source of
# chauffage-air.svg: regenerate with outils/schemas.sh after any change.
metadata:
  title: Phase 2 — Câblage 230 V des deux câbles chauffants

connectors:
  CORDON:
    type: (N) Cordon secteur 3G 1 mm² avec fiche
    pinlabels: [Phase, Neutre, Terre]
  PHASE:
    type: (S) Bornier à levier, 3 places
    subtype: phase
    pinlabels: ["1", "2", "3"]
  NEUTRE:
    type: (S) Bornier à levier, 3 places
    subtype: neutre
    pinlabels: ["1", "2", "3"]
  TERRE:
    type: (S) Bornier à levier, 3 places ou plus
    subtype: terre
    pinlabels: ["1", "2", "3"]
  RELAIS1:
    type: (E) Relais 1 du module (câble du substrat, K1)
    pinlabels: [COM, "NO", NC (libre)]
  RELAIS2:
    type: (E) Relais 2 du module (câble de l'air, K2)
    pinlabels: [COM, "NO", NC (libre)]
  SOCLE_SUBSTRAT:
    type: (Q) Socle de prise SUBSTRAT
    subtype: reçoit le câble de 50 W (W)
    pinlabels: ["L", "N", Terre]
  SOCLE_AIR:
    type: (Z) Socle de prise AIR
    subtype: reçoit le câble de 25 W (W)
    pinlabels: ["L", "N", Terre]

cables:
  W1:
    wirecount: 3
    colors: [BN, BU, GNYE]
    gauge: 1 mm2
    category: bundle
    type: Fils du cordon
  W2:
    wirecount: 1
    colors: [BN]
    gauge: 1 mm2
    category: bundle
    type: (R) Fil
  W3:
    wirecount: 1
    colors: [BN]
    gauge: 1 mm2
    category: bundle
    type: (R) Fil
  W4:
    wirecount: 1
    colors: [BN]
    gauge: 1 mm2
    category: bundle
    type: (R) Fil
  W5:
    wirecount: 1
    colors: [BN]
    gauge: 1 mm2
    category: bundle
    type: (R) Fil
  W6:
    wirecount: 2
    colors: [BU, GNYE]
    gauge: 1 mm2
    category: bundle
    type: Fils du socle SUBSTRAT
  W7:
    wirecount: 2
    colors: [BU, GNYE]
    gauge: 1 mm2
    category: bundle
    type: Fils du socle AIR

connections:
  - - CORDON: [1]
    - W1: [1]
    - PHASE: [1]
  - - CORDON: [2]
    - W1: [2]
    - NEUTRE: [1]
  - - CORDON: [3]
    - W1: [3]
    - TERRE: [1]
  - - PHASE: [2]
    - W2: [1]
    - RELAIS1: [1]
  - - PHASE: [3]
    - W3: [1]
    - RELAIS2: [1]
  - - RELAIS1: [2]
    - W4: [1]
    - SOCLE_SUBSTRAT: [1]
  - - RELAIS2: [2]
    - W5: [1]
    - SOCLE_AIR: [1]
  - - NEUTRE: [2]
    - W6: [1]
    - SOCLE_SUBSTRAT: [2]
  - - TERRE: [2]
    - W6: [2]
    - SOCLE_SUBSTRAT: [3]
  - - NEUTRE: [3]
    - W7: [1]
    - SOCLE_AIR: [2]
  - - TERRE: [3]
    - W7: [2]
    - SOCLE_AIR: [3]
