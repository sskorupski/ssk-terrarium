; ssk-terrarium — PlatformIO configuration.
; Every platform and library version is pinned: a build must not change
; because a registry published something new.

[platformio]
default_envs = esp32dev

[env]
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra

[env:esp32dev]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts =
  post:outils/version_firmware.py
  post:outils/cle_mise_a_jour.py
lib_deps =
  sensirion/Sensirion I2C SHT4x@1.1.2
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@4.0.6
  adafruit/DHT sensor library@1.4.6
  adafruit/Adafruit Unified Sensor@1.1.15
  knolleary/PubSubClient@2.8
  esp32async/ESPAsyncWebServer@3.12.1
  esp32async/AsyncTCP@3.5.0
  bblanchon/ArduinoJson@7.4.3

; Host-side tests of the hardware-free logic (lib/control).
[env:native]
platform = platformio/native@1.2.1
test_framework = unity
; libsodium verifies minisign signatures on the host as on the board.
extra_scripts = pre:outils/libsodium_natif.py
; Same pinned version as the board: MQTT commands are parsed by host tests too.
lib_deps =
  bblanchon/ArduinoJson@7.4.3
build_flags =
  ${env.build_flags}
  -Werror
